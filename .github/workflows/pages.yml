name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust & WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run Rust tests
        run: cargo test

      - name: Build Rust to WebAssembly
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Stage static GitHub Pages artifact
        run: |
          mkdir -p _site
          cp index.html style.css app.js .nojekyll _site/
          cp target/wasm32-unknown-unknown/release/bouquet_wasm.wasm _site/bouquet.wasm
          WASM_B64=$(base64 -w 0 _site/bouquet.wasm)
          printf '// Auto-generated in CI from bouquet.wasm\nwindow.__BOUQUET_WASM_B64__ = "%s";\n' "$WASM_B64" > _site/wasm_fallback.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
